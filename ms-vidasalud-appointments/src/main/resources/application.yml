server:
  port: 8081

spring:
  application:
    name: ms-vidasalud-appointments
  datasource:
    url: jdbc:h2:mem:vidasalud
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        spring.json.add.type.headers: false

rabbitmq:
  exchange: vidasalud.appointments.exchange
  queue:
    notify: vidasalud.notify.queue
  routing-key:
    created: appointment.created
    status-changed: appointment.status.changed
  dlx: vidasalud.appointments.dlx
  dlq: vidasalud.notify.dlq
  host: ${RABBITMQ_HOST:ELASTIC_IP_RABBITMQ}
  port: 5672
  username: guest
  password: guest

kafka:
  topics:
    events: vidasalud.appointments.events
    analytics: vidasalud.appointments.analytics